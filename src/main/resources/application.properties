spring.application.name=flea

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flea}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (dev defaults; override via env for non-local environments)
application.security.jwt.secret-key=${JWT_SECRET:mHLOPsw5b1tOk+xegiEF5XABgtaNGr0KCcFmgWRv4ASl+YlUTp6uL0TKrbRENZdU2+siK3Qses6jH0xQ+VtcjA==}
application.security.jwt.expiration=${JWT_EXPIRATION:900000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}
